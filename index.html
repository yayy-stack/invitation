<style>
:root{--ivory:#FAF8F5;--stone:#F0ECE1;--oxblood:#6B0F1A;--charcoal:#1A1617}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ivory);color:var(--charcoal);font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden;height:100dvh}
::selection{background:var(--oxblood);color:var(--ivory)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--stone)}::-webkit-scrollbar-thumb{background:var(--oxblood)}
img{display:block}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
a{color:inherit}
.grain{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:.55;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.32'/%3E%3C/svg%3E");background-size:180px 180px}
.mono{font-family:'Space Mono',monospace}
.disp{font-family:'Syne',sans-serif}
.serif{font-family:'Instrument Serif',Georgia,serif}
/* ---------- GATE ---------- */
#gate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;overflow-y:auto;background:var(--charcoal);transition:transform .9s cubic-bezier(.77,0,.175,1)}
body.unlocked #gate{transform:translateY(-100%)}
.gate-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.12) brightness(.85)}
.gate-tint{position:absolute;inset:0;background:var(--oxblood);mix-blend-mode:multiply;opacity:.75}
.gate-shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(26,22,23,.7),transparent 30%,transparent 65%,rgba(26,22,23,.85))}
.gate-body{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;text-align:center;padding:24px 16px}
.gate-tag{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.3em;color:rgba(250,248,245,.8)}
.gate-title{margin-top:12px;font-size:clamp(30px,6vw,60px);line-height:1}
.gate-title b{font-family:'Syne',sans-serif;font-weight:800;color:var(--ivory);letter-spacing:-.02em}
.gate-title i{font-family:'Instrument Serif',serif;font-weight:400;color:var(--ivory)}
.gate-badge{margin-top:12px;display:inline-block;background:var(--oxblood);padding:5px 12px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.25em;color:var(--ivory)}
.lock{position:relative;display:flex;flex-direction:column;align-items:center;width:100%}
#ring{position:absolute;left:50%;top:50%;width:100%;height:100%;transform:translate(-50%,-50%);pointer-events:none;overflow:visible}
#disc{position:relative;width:min(50vw,220px);aspect-ratio:1;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#disc:active{cursor:grabbing}
#disc svg{width:100%;height:100%;filter:drop-shadow(0 24px 60px rgba(26,22,23,.55))}
#disc.spin svg{animation:spin 1.4s linear infinite}
.notch{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:12px solid var(--oxblood);pointer-events:none}
#rot{margin-top:16px;height:auto;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;color:rgba(250,248,245,.9);text-transform:uppercase}
#badge{display:none;margin-top:16px;height:22px;align-items:center;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.25em;color:var(--ivory);background:var(--oxblood);padding:2px 12px}
.ticket{position:relative;width:100%;max-width:360px;border:1px solid rgba(250,248,245,.8);background:rgba(26,22,23,.55);backdrop-filter:blur(6px);padding:16px 24px;margin-top:24px}
.ticket i{position:absolute;width:10px;height:10px;border-color:var(--oxblood);border-style:solid;border-width:0}
.ticket i:nth-child(1){top:-2px;left:-2px;border-top-width:2px;border-left-width:2px}
.ticket i:nth-child(2){top:-2px;right:-2px;border-top-width:2px;border-right-width:2px}
.ticket i:nth-child(3){bottom:-2px;left:-2px;border-bottom-width:2px;border-left-width:2px}
.ticket i:nth-child(4){bottom:-2px;right:-2px;border-bottom-width:2px;border-right-width:2px}
.ticket small{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.35em;color:rgba(250,248,245,.7)}
.ticket p{margin-top:4px;font-family:'Instrument Serif',serif;font-style:italic;font-size:22px;color:var(--ivory);word-break:break-word}
/* ---------- REVEAL / MASK ---------- */
.rv{opacity:0;transform:translateY(32px);transition:opacity .8s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1)}
.rv.in{opacity:1;transform:none}
.mask{display:block;overflow:hidden}
.mask>span{display:block;transform:translateY(110%);transition:transform .9s cubic-bezier(.22,1,.36,1)}
.mask.in>span{transform:none}
/* ---------- SECTIONS COMMON ---------- */
section{border-top:1px solid var(--oxblood)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--oxblood);padding:18px 24px}
.sec-head .tag{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.3em;color:var(--oxblood)}
.sec-head .meta{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.25em;color:rgba(26,22,23,.5)}
/* ---------- MARQUEE ---------- */
.marq{background:var(--oxblood);color:var(--ivory);overflow:hidden}
.marq-in{display:flex;white-space:nowrap;animation:marq 26s linear infinite;padding:10px 0}
.marq-in span{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.25em;display:flex;align-items:center}
.marq-in span i{font-style:normal;padding:0 24px;color:rgba(250,248,245,.6)}
@keyframes marq{to{transform:translateX(-50%)}}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- HERO ---------- */
.hero-grid{display:grid;grid-template-columns:1fr}
.hero-media{position:relative;overflow:hidden;border-bottom:1px solid var(--oxblood)}
.hero-media img{width:100%;height:52vh;max-height:80vh;object-fit:cover;filter:grayscale(.35) sepia(.12) contrast(1.06) saturate(.92);transform:scale(1.08);will-change:transform}
.hero-media .chip{position:absolute;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.3em;color:var(--ivory);background:rgba(26,22,23,.6);backdrop-filter:blur(4px);padding:4px 10px}
.chip.tl{top:16px;left:16px}.chip.br{bottom:16px;right:16px;background:var(--oxblood)}
.hero-side{background:var(--stone);display:flex;flex-direction:column}
.hero-side .inner{padding:40px 24px 56px;display:flex;flex-direction:column;gap:40px;flex:1;justify-content:space-between}
.hero-names{line-height:.95}
.hero-names .l1{font-family:'Syne',sans-serif;font-weight:800;letter-spacing:-.03em;font-size:clamp(40px,7vw,68px);color:var(--charcoal)}
.hero-names .l2{font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(40px,7vw,68px);color:var(--oxblood)}
.hero-quote{margin-top:24px;font-family:'Instrument Serif',serif;font-style:italic;font-size:19px;color:rgba(26,22,23,.8);max-width:440px}
.cd-top{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--oxblood);padding-top:18px;margin-bottom:16px}
.cd-top .tag{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.3em;color:var(--oxblood)}
.cd-top .live{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--oxblood)}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cd>div{border:1px solid var(--oxblood);background:var(--ivory);text-align:center;padding:14px 4px}
.cd b{font-family:'Space Mono',monospace;font-weight:700;font-size:clamp(24px,4vw,38px);color:var(--oxblood);font-variant-numeric:tabular-nums}
.cd small{display:block;margin-top:4px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.3em;color:rgba(26,22,23,.6)}
.cd-note{margin-top:16px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.2em;color:rgba(26,22,23,.5)}
/* ---------- COUPLE ---------- */
.couple-grid{display:grid;grid-template-columns:1fr}
.person{padding:40px 24px 56px;display:flex;flex-direction:column;gap:32px}
.person+.person{border-top:1px solid var(--oxblood)}
.frame{position:relative;max-width:380px}
.frame::before{content:"";position:absolute;top:-12px;left:-12px;width:100%;height:100%;border:1px solid var(--oxblood)}
.frame .imgwrap{overflow:hidden}
.frame img{width:100%;aspect-ratio:4/5;object-fit:cover;filter:grayscale(.35) sepia(.12) contrast(1.06) saturate(.92);transition:transform .7s ease}
.frame:hover img{transform:scale(1.04)}
.frame .tag{position:absolute;bottom:12px;right:12px;background:var(--oxblood);color:var(--ivory);font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.3em;padding:4px 10px}
.person h3{line-height:1;margin-top:4px}
.person h3 .full{display:block;font-family:'Syne',sans-serif;font-weight:800;letter-spacing:-.02em;font-size:clamp(30px,5vw,48px);color:var(--charcoal);text-transform:uppercase}
.person h3 .nick{display:block;margin-top:8px;font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(24px,3.5vw,32px);color:var(--oxblood)}
.person .parents{margin-top:16px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.12em;color:rgba(26,22,23,.7)}
.ig{margin-top:auto;display:inline-flex;align-items:center;gap:12px;align-self:flex-start;border:1px solid var(--oxblood);padding:12px 20px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.25em;color:var(--oxblood);text-decoration:none;transition:background .3s,color .3s}
.ig:hover{background:var(--oxblood);color:var(--ivory)}
/* ---------- GALLERY ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:20px 24px;border-bottom:1px solid var(--oxblood)}
.filters button{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;padding:10px 16px;border:1px solid rgba(107,15,26,.4);color:var(--oxblood);transition:background .3s,color .3s,border-color .3s}
.filters button:hover{border-color:var(--oxblood);background:rgba(107,15,26,.05)}
.filters button.on{background:var(--oxblood);color:var(--ivory);border-color:var(--oxblood)}
.g-grid{display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:150px;gap:14px;padding:20px}
.g-item{position:relative;overflow:hidden;border:1px solid var(--oxblood);cursor:zoom-in}
.g-item img{width:100%;height:100%;object-fit:cover;filter:grayscale(.35) sepia(.12) contrast(1.06) saturate(.92);transition:transform .7s ease}
.g-item:hover img{transform:scale(1.1)}
.g-item figcaption{position:absolute;bottom:8px;left:8px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.25em;color:var(--ivory);background:rgba(26,22,23,.7);backdrop-filter:blur(4px);padding:2px 8px}
.g-end{display:flex;align-items:center;gap:12px;margin:28px 24px 40px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.3em;color:rgba(26,22,23,.5)}
.g-end::before,.g-end::after{content:"";flex:1;border-top:1px dashed rgba(107,15,26,.4)}
/* ---------- STORY ---------- */
#story{background:var(--stone)}
#story h2{font-family:'Syne',sans-serif;font-weight:800;letter-spacing:-.03em;font-size:clamp(36px,6vw,60px);color:var(--charcoal)}
#story h2 i{font-family:'Instrument Serif',serif;font-weight:400;font-style:italic;color:var(--oxblood)}
#story .sub{margin-top:16px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;color:rgba(26,22,23,.6)}
.tracks{margin-top:40px;border-top:1px solid var(--oxblood)}
.track{display:grid;grid-template-columns:1fr;gap:6px;border-bottom:1px solid var(--oxblood);padding:24px 12px;transition:background .3s}
.track:hover{background:var(--oxblood)}
.track .no{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.3em;color:var(--oxblood);transition:color .3s}
.track .tt{font-family:'Syne',sans-serif;font-weight:700;letter-spacing:-.02em;font-size:clamp(20px,3vw,30px);color:var(--charcoal);transition:color .3s}
.track .st{font-family:'Instrument Serif',serif;font-style:italic;font-size:18px;color:var(--oxblood);transition:color .3s}
.track .nt{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.2em;color:rgba(26,22,23,.5);transition:color .3s}
.track:hover .no,.track:hover .tt,.track:hover .st,.track:hover .nt{color:var(--ivory)}
.story-foot{display:flex;align-items:center;gap:16px;margin-top:32px}
.barcode{height:40px;width:160px;background-image:repeating-linear-gradient(to right,var(--charcoal) 0 2px,transparent 2px 4px,var(--charcoal) 4px 7px,transparent 7px 9px,var(--charcoal) 9px 10px,transparent 10px 14px)}
.barcode.iv{background-image:repeating-linear-gradient(to right,rgba(250,248,245,.9)
